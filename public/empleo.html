<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del empleo | TalentoLink</title>
  <meta name="description" content="Descripción detallada del empleo: responsabilidades, requisitos, beneficios, contacto de la empresa y valoraciones.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="empleos">
  <div id="tl-header"></div>

  <!-- Todo el contenido se genera en js/pages/empleo.js según el ?id= de la URL -->
  <main class="container mt-4" id="detalle"></main>

  <!-- =====================================================
       MODAL: APLICAR AL TRABAJO
       Crea un registro en "postulaciones"
       ===================================================== -->
  <div class="modal fade" id="modal-aplicar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <form class="modal-content border-0 rounded-4" id="form-aplicar">
        <div class="modal-header"><h2 class="modal-title h5" id="aplicar-titulo">Aplicar</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body p-4">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Nombre completo</label><input class="form-control" id="ap-nombre" required></div>
            <div class="col-md-6"><label class="form-label">Correo</label><input type="email" class="form-control" id="ap-email" required></div>
            <div class="col-md-6"><label class="form-label">Teléfono</label><input class="form-control" id="ap-telefono" placeholder="+504 0000-0000"></div>
            <div class="col-md-6"><label class="form-label">Años de experiencia</label><select class="form-select"><option>Sin experiencia</option><option>1-2 años</option><option>3-5 años</option><option>5+ años</option></select></div>
            <div class="col-12">
              <label class="form-label">Currículum (PDF o DOCX)</label>
              <input type="file" class="form-control" accept=".pdf,.doc,.docx" id="ap-cv">
              <div class="form-text">Si ya subiste tu CV en tu perfil, se adjuntará automáticamente.</div>
            </div>
            <div class="col-12"><label class="form-label">Carta de presentación</label><textarea class="form-control" rows="4" id="ap-carta" placeholder="Cuéntale a la empresa por qué eres ideal para el puesto..."></textarea></div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary px-4" id="btn-enviar-postulacion"><i class="bi bi-send me-1"></i>Enviar postulación</button></div>
      </form>
    </div>
  </div>

  <div id="tl-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/empleo.js"></script>
</body>
</html>
