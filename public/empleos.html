<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar empleos | ChambeaSV</title>
  <meta name="description" content="Resultados de búsqueda de empleos con filtros por nivel de experiencia, sector laboral, tipo de contrato, modalidad y salario.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="empleos" class="page-search">
  <div id="tl-header"></div>

  <main>
    <!-- Barra de búsqueda superior (precargada con los parámetros de la URL) -->
    <section class="tl-page-header">
      <div class="container">
        <div class="search-heading">
          <span class="page-kicker"><i class="bi bi-stars"></i> Tu próximo paso profesional</span>
          <h1 class="mb-2">Encuentra tu próxima oportunidad</h1>
          <p>Explora puestos que se ajustan a tu experiencia, tus intereses y tu estilo de vida.</p>
        </div>
        <form class="tl-search-box p-2" id="form-busqueda" data-nota="Búsqueda|Mantiene los criterios enviados desde el inicio y permite modificarlos sin recargar.">
          <div class="row g-2">
            <div class="col-md-4"><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input class="form-control" id="f-q" placeholder="Puesto, empresa o palabra clave"></div></div>
            <div class="col-md-3"><div class="input-group"><span class="input-group-text"><i class="bi bi-geo-alt"></i></span><input class="form-control" id="f-ubicacion" placeholder="Ubicación"></div></div>
            <div class="col-md-3">
              <select class="form-select" id="f-tipo"><option value="">Tipo de trabajo</option><option>Tiempo completo</option><option>Medio tiempo</option><option>Prácticas</option><option>Freelance</option></select>
            </div>
            <div class="col-md-2 d-grid"><button class="btn btn-primary" id="btn-buscar">Buscar</button></div>
          </div>
        </form>
      </div>
    </section>

    <div class="container mt-4">
      <div class="row g-4">
        <!-- =====================================================
             FILTROS LATERALES (izquierda)
             Cada cambio vuelve a filtrar la lista al instante
             ===================================================== -->
        <aside class="col-lg-3">
          <div class="tl-card p-4 tl-filters" id="panel-filtros" data-nota="Filtros adicionales|Refinan la búsqueda por nivel de experiencia, sector laboral, tipo de contrato, modalidad y salario.">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h6 mb-0 fw-bold text-dark text-uppercase-0" style="text-transform:none;letter-spacing:0;font-size:1rem;color:var(--tl-text)"><i class="bi bi-funnel me-1"></i>Filtros</h2>
              <a href="#" class="small" id="btn-limpiar">Limpiar</a>
            </div>
            <div class="tl-filter-group"><h6>Nivel de experiencia</h6><div id="f-nivel"></div></div>
            <div class="tl-filter-group"><h6>Sector laboral</h6><div id="f-sector"></div></div>
            <div class="tl-filter-group"><h6>Tipo de contrato</h6><div id="f-contrato"></div></div>
            <div class="tl-filter-group"><h6>Modalidad</h6><div id="f-modalidad"></div></div>
            <div class="tl-filter-group">
              <h6>Salario mínimo: <span class="text-primary" id="salario-label">$0</span></h6>
              <input type="range" class="form-range" min="0" max="3000" step="100" value="0" id="f-salario">
            </div>
            <div class="tl-filter-group">
              <h6>Fecha de publicación</h6>
              <select class="form-select form-select-sm" id="f-fecha">
                <option value="">Cualquier fecha</option><option value="1">Últimas 24 horas</option><option value="7">Última semana</option><option value="30">Último mes</option>
              </select>
            </div>
          </div>
        </aside>

        <!-- =====================================================
             LISTA DE RESULTADOS
             ===================================================== -->
        <section class="col-lg-9">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div><b id="total-resultados">0</b> <span class="text-muted">empleos encontrados</span> <span id="filtros-activos"></span></div>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-primary" id="btn-guardar-alerta" data-nota="Crear alerta|Guarda la búsqueda actual como alerta de empleo (correo/SMS)."><i class="bi bi-bell"></i> Crear alerta con esta búsqueda</button>
              <select class="form-select form-select-sm w-auto" id="f-orden">
                <option value="reciente">Más recientes</option><option value="salario">Mayor salario</option><option value="titulo">Título A-Z</option>
              </select>
            </div>
          </div>
          <div class="d-grid gap-3" id="resultados" data-nota="Resultados|Cada tarjeta muestra título, empresa, ubicación, tipo de trabajo y fecha de publicación."></div>
        </section>
      </div>
    </div>
  </main>

  <div id="tl-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/empleos.js"></script>
</body>
</html>
