<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valoraciones de empresas | ChambeaSV</title>
  <meta name="description" content="Opiniones y calificaciones de empleados sobre las empresas para tomar decisiones informadas sobre dónde trabajar.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link rel="icon" href="assets/chambeasv-icon.svg" type="image/svg+xml">
</head>
<body data-page="valoraciones">
  <div id="tl-header"></div>

  <section class="tl-page-header">
    <div class="container">
      <h1 class="h3 mb-1">Valoraciones de empresas</h1>
      <p>Conoce la experiencia de quienes ya trabajaron ahí antes de postularte.</p>
    </div>
  </section>

  <main class="container mt-4">
    <div class="row g-4">
      <!-- Lista de empresas con búsqueda y filtro por sector -->
      <section class="col-lg-5">
        <div class="tl-card p-3 mb-3" data-nota="Buscar empresas|Filtra por nombre o sector y ordena por mejor calificación o más reseñas.">
          <div class="row g-2">
            <div class="col-12"><div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input class="form-control" id="buscar-empresa" placeholder="Buscar empresa..."></div></div>
            <div class="col-6"><select class="form-select form-select-sm" id="filtro-sector"><option value="">Todos los sectores</option></select></div>
            <div class="col-6"><select class="form-select form-select-sm" id="orden-empresas"><option value="valor">Mejor calificadas</option><option value="total">Más reseñas</option><option value="nombre">Nombre A-Z</option></select></div>
          </div>
        </div>
        <div class="d-grid gap-2" id="lista-empresas" data-nota="Empresas|Cada tarjeta muestra la calificación promedio. Clic para ver detalle y reseñas."></div>
      </section>

      <!-- Detalle de la empresa seleccionada + reseñas -->
      <section class="col-lg-7">
        <div id="detalle-empresa" style="position:sticky;top:140px"></div>
      </section>
    </div>
  </main>

  <div id="tl-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/valoraciones.js"></script>
</body>
</html>
